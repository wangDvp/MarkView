name: Upload v1.2.0 release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    if: github.repository == 'wangDvp/MarkView'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the verified release commit
        shell: bash
        run: |
          set -euo pipefail
          git init release-source
          git -C release-source remote add origin https://github.com/wangDvp/MarkView.git
          git -C release-source fetch --depth=1 origin refs/tags/v1.2.0
          git -C release-source checkout --detach FETCH_HEAD
          test "$(git -C release-source rev-parse HEAD)" = 7abecd0da00cca84eee184598ae20337c08156a0

      - name: Package and compare with the local release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-source
          python3 scripts/package-release.py --output ../release-artifacts
          cd ../release-artifacts
          sha256sum --check <<'CHECKSUMS'
          7028f00249fae3a4a9516540dc6b05c2e4d3fd4c13f507431bb523d6b85bb528  MarkView-v1.2.0.zip
          e97325cf8a828edcfcbd0317b0c7e097c20193da3ee5bcc8b12049ba02c0ed07  MarkView-v1.2.0-source.zip
          CHECKSUMS

      - name: Upload only missing verified assets to the existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-artifacts
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          repository = 'wangDvp/MarkView'
          endpoint = f'repos/{repository}/releases/448395802'
          release = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert release['draft'] and release['tag_name'] == 'v1.2.0'
          assert release['target_commitish'] == '7abecd0da00cca84eee184598ae20337c08156a0'
          existing = {asset['name']: asset for asset in release['assets']}
          for name in ('MarkView-v1.2.0.zip', 'MarkView-v1.2.0-source.zip', 'SHA256SUMS.txt'):
              file = Path(name)
              digest = 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest()
              if name in existing:
                  asset = existing[name]
                  assert asset['state'] == 'uploaded' and asset['size'] == file.stat().st_size
                  assert asset['digest'] == digest
              else:
                  subprocess.run(['gh', 'release', 'upload', 'v1.2.0', name, '--repo', repository], check=True)
          PY
